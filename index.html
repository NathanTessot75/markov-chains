<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Markov Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body { background-color: #0f172a; color: white; font-family: 'Inter', sans-serif; overscroll-behavior: none; }
        .active-node-shadow { filter: drop-shadow(0 0 15px currentColor); }
        .selected-node-border { stroke-width: 4px; stroke: white; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
        .grab-cursor { cursor: grab; }
        .grab-cursor:active { cursor: grabbing; }
        .node-cursor { cursor: move; }
        @keyframes pulse-link { 0%, 100% { stroke-opacity: 1; stroke-width: 3; } 50% { stroke-opacity: 0.6; stroke-width: 4; } }
        .active-link-pulse { animation: pulse-link 1s ease-in-out infinite; }
        @keyframes pop-in { 0% { transform: scale(0); opacity: 0; } 60% { transform: scale(1.2); } 100% { transform: scale(1); opacity: 1; } }
        .animate-pop { animation: pop-in 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes slide-in-right { 0% { transform: translateX(20%); opacity: 0; } 100% { transform: none; opacity: 1; } }
        @keyframes slide-in-left { 0% { transform: translateX(-20%); opacity: 0; } 100% { transform: none; opacity: 1; } }
        @keyframes slide-in-bottom { 0% { transform: translateY(100%); opacity: 0; } 100% { transform: none; opacity: 1; } }
        .slide-enter-right { animation: slide-in-right 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; }
        .slide-enter-left { animation: slide-in-left 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; }
        .slide-enter-bottom { animation: slide-in-bottom 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .dark-card { background-color: #1E293B; border-radius: 16px; border: 1px solid #334155; padding: 20px; }
        .dark-card-header { font-size: 18px; font-weight: bold; color: white; }
        .dark-card-desc { font-size: 14px; color: #94A3B8; margin-top: 4px; }
        .accordion-wrapper { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.3s ease-in-out; }
        .accordion-wrapper.open { grid-template-rows: 1fr; }
        .accordion-content { overflow: hidden; opacity: 0; transition: opacity 0.4s ease-in-out; }
        .accordion-wrapper.open .accordion-content { opacity: 1; transition-delay: 0.1s; }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px); display: flex; justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: #1E293B; border: 1px solid #334155; border-radius: 24px; padding: 32px; max-width: 350px; width: 90%; text-align: center; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); animation: modal-enter 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes modal-enter { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .error-toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; background-color: #ef4444; color: white; padding: 16px 20px; border-radius: 12px; box-shadow: 0 10px 20px -3px rgba(0, 0, 0, 0.3); display: flex; align-items: center; justify-content: center; gap: 12px; z-index: 9999; font-weight: 600; font-size: 14px; line-height: 1.4; text-align: left; animation: slide-down 0.3s ease-out; }
        @keyframes slide-down { from { transform: translate(-50%, -20px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
        @keyframes shine { 0% { background-position: -100% 0; } 100% { background-position: 100% 0; } }
        .animate-shine { background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0) 100%); background-size: 200% 100%; animation: shine 2s infinite; }
        @keyframes dash { to { stroke-dashoffset: -20; } }
        .marching-ants { animation: dash 1s linear infinite; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback, useMemo } = React;

        /* --- ICONS --- */
        const Icons = {
            Plus: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>,
            Minus: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>,
            Trash: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>,
            Play: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>,
            Pause: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>,
            RotateCcw: ({size=20}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>,
            Eye: ({ size = 20 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>,
            EyeOff: ({ size = 20 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7c.44 0 .87-.03 1.28-.09"/><line x1="2" y1="2" x2="22" y2="22"/></svg>,
            ArrowRight: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>,
            ArrowLeft: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>,
            ChevronDown: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m6 9 6 6 6-6"/></svg>,
            RotateCw: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>,
            ZoomIn: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>,
            ZoomOut: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>,
            Maximize: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>,
            BoxSelect: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 3a2 2 0 0 0-2 2"/><path d="M19 3a2 2 0 0 1 2 2"/><path d="M21 19a2 2 0 0 1-2 2"/><path d="M5 21a2 2 0 0 1-2-2"/><path d="M9 3h1"/><path d="M9 21h1"/><path d="M14 3h1"/><path d="M14 21h1"/><path d="M3 9v1"/><path d="M21 9v1"/><path d="M3 14v1"/><path d="M21 14v1"/></svg>,
            Trophy: ({size=24}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>,
            BookOpen: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>,
            Target: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>,
            Alert: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>,
            Lock: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>,
            Palette: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="13.5" cy="6.5" r=".5"/><circle cx="17.5" cy="10.5" r=".5"/><circle cx="8.5" cy="7.5" r=".5"/><circle cx="6.5" cy="12.5" r=".5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/></svg>,
            Brush: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m9.06 11.9 8.07-8.069a16 16 0 0 1 2.626 2.627l-8.07 8.068"/><path d="M7.05 14.2c-2.55.25-4.49 2.6-3.87 5.15.25 1.05.65 1.76.65 1.76H8c1.35 0 2.25-.45 2.5-1.5.85-3.6-1.9-5.15-3.45-4.41Z"/></svg>
        };

        const StarIcon = ({ filled, size = 32 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill={filled ? "#EAB308" : "none"} stroke={filled ? "#EAB308" : "currentColor"} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
            </svg>
        );

        const Button = ({ children, onClick, variant = 'primary', className = '', title = '' }) => {
            const baseStyle = "px-4 py-2 rounded-xl font-semibold transition-all duration-200 flex items-center justify-center gap-2 active:scale-95 text-sm";
            const variants = {
                primary: "bg-gradient-to-r from-cyan-500 to-blue-600 text-white shadow-lg shadow-cyan-500/20 hover:shadow-cyan-500/40 py-3",
                secondary: "bg-emerald-500 text-white shadow-lg shadow-emerald-500/20 hover:bg-emerald-400 py-3",
                icon: "p-2 bg-slate-800 text-slate-300 hover:bg-slate-700 rounded-lg border border-slate-700",
                danger: "p-2 bg-red-500/10 text-red-400 hover:bg-red-500/20 rounded-lg border border-red-500/30",
                success: "bg-gradient-to-r from-green-500 to-emerald-600 text-white shadow-lg shadow-green-500/20 hover:shadow-green-500/40 py-3 text-lg",
            };
            return <button onClick={onClick} title={title} className={`${baseStyle} ${variants[variant] || variants.primary} ${className}`}>{children}</button>;
        };

        /* --- DATA & CONFIG --- */
        const SANDBOX_NODES = [
            { id: 'A', x: 200, y: 100, color: '#3b82f6', label: 'A' },
            { id: 'B', x: 300, y: 250, color: '#06b6d4', label: 'B' },
            { id: 'C', x: 100, y: 250, color: '#ec4899', label: 'C' },
        ];
        const SANDBOX_LINKS = [
            { source: 'A', target: 'B', prob: 0.5 }, { source: 'A', target: 'C', prob: 0.3 }, { source: 'A', target: 'A', prob: 0.2 },
            { source: 'B', target: 'C', prob: 0.6 }, { source: 'B', target: 'B', prob: 0.4 },
            { source: 'C', target: 'A', prob: 0.7 }, { source: 'C', target: 'B', prob: 0.3 },
        ];

        const LEVELS_DATA = [
            { 
                id: 1, title: "Tour du Monde", desc: "Cycle Déterministe", difficulty: "Facile", locked: false,
                objective: "Créez un cycle (A, B, C, A) avec probabilité 1 sur chaque transition.",
                initialNodes: [{ id: 'A', x: 200, y: 100, color: '#ec4899', label: 'A' }, { id: 'B', x: 300, y: 300, color: '#3b82f6', label: 'B' }, { id: 'C', x: 100, y: 300, color: '#f59e0b', label: 'C' }],
                initialLinks: [{ source: 'A', target: 'A', prob: 0.33 }, { source: 'A', target: 'B', prob: 0.33 }, { source: 'A', target: 'C', prob: 0.34 }, { source: 'B', target: 'A', prob: 0.33 }, { source: 'B', target: 'B', prob: 0.33 }, { source: 'B', target: 'C', prob: 0.34 }, { source: 'C', target: 'A', prob: 0.33 }, { source: 'C', target: 'B', prob: 0.33 }, { source: 'C', target: 'C', prob: 0.34 }],
                checkSuccess: ({ links }) => { const ab = links.find(l => l.source === 'A' && l.target === 'B'); const bc = links.find(l => l.source === 'B' && l.target === 'C'); const ca = links.find(l => l.source === 'C' && l.target === 'A'); return ab && ab.prob === 1 && bc && bc.prob === 1 && ca && ca.prob === 1; }
            },
            { 
                id: 2, title: "Le Puits", desc: "État absorbant", difficulty: "Moyen", locked: true,
                objective: "Modifiez les probabilités pour que sur le long terme, on finisse toujours dans l'état C.",
                initialNodes: [{ id: 'A', x: 200, y: 50, color: '#ec4899', label: 'A' }, { id: 'B', x: 100, y: 200, color: '#3b82f6', label: 'B' }, { id: 'C', x: 300, y: 200, color: '#10b981', label: 'C' }],
                initialLinks: [{ source: 'A', target: 'B', prob: 0.5 }, { source: 'A', target: 'A', prob: 0.5 }, { source: 'B', target: 'A', prob: 0.5 }, { source: 'B', target: 'B', prob: 0.5 }, { source: 'C', target: 'B', prob: 0.5 }, { source: 'C', target: 'C', prob: 0.5 }],
                checkSuccess: ({ pi }) => pi && pi.length >= 3 && pi[2] > 0.99,
            },
            { 
                id: 3, title: "La Hiérarchie", desc: "Contrôle précis", difficulty: "Difficile", locked: true,
                objective: "Faites en sorte que l'état A soit visité 50% du temps, et les autres 25% chacun.",
                initialNodes: [{ id: 'A', x: 200, y: 100, color: '#f59e0b', label: 'A' }, { id: 'B', x: 100, y: 300, color: '#3b82f6', label: 'B' }, { id: 'C', x: 300, y: 300, color: '#ec4899', label: 'C' }],
                initialLinks: [{ source: 'A', target: 'B', prob: 0.5 }, { source: 'A', target: 'C', prob: 0.5 }, { source: 'B', target: 'B', prob: 1.0 }, { source: 'C', target: 'C', prob: 1.0 }],
                checkSuccess: ({ pi }) => pi && pi.length >= 3 && Math.abs(pi[0] - 0.5) < 0.02 && Math.abs(pi[1] - 0.25) < 0.02,
            },
            { 
                id: 4, title: "Le Touriste", desc: "Prendre son temps", difficulty: "Moyen", locked: true,
                objective: "Allez de A vers C en passant au moins 4 fois par B.",
                initialNodes: [{ id: 'A', x: 100, y: 200, color: '#f59e0b', label: 'A' }, { id: 'B', x: 200, y: 100, color: '#3b82f6', label: 'B' }, { id: 'C', x: 300, y: 200, color: '#10b981', label: 'C' }],
                initialLinks: [{ source: 'A', target: 'B', prob: 1.0 }, { source: 'B', target: 'B', prob: 0.0 }, { source: 'B', target: 'C', prob: 1.0 }, { source: 'C', target: 'C', prob: 1.0 }],
                checkSuccess: ({ path }) => {
                    if (!path || path.length === 0) return false;
                    const last = path[path.length - 1];
                    if(last !== 'C') return false;
                    const bCount = path.filter(p => p === 'B').length;
                    const pathStr = path.join('');
                    if (pathStr.includes('BA')) return false; 
                    if (pathStr.includes('CB')) return false; 
                    if (pathStr.includes('AC')) return false; 
                    return bCount >= 4;
                }
            },
            { 
                id: 5, title: "Le Collecteur", desc: "Exploration rapide", difficulty: "Difficile", locked: true,
                objective: "Visitez les états X, Y et Z au moins une fois chacun en moins de 25 étapes.",
                initialNodes: [
                    { id: 'H', x: 200, y: 200, color: '#f59e0b', label: 'H' },
                    { id: 'X', x: 200, y: 50, color: '#3b82f6', label: 'X' },
                    { id: 'Y', x: 50, y: 300, color: '#ec4899', label: 'Y' },
                    { id: 'Z', x: 350, y: 300, color: '#10b981', label: 'Z' }
                ],
                initialLinks: [
                    { source: 'H', target: 'H', prob: 1.0 }, { source: 'H', target: 'X', prob: 0.0 }, { source: 'H', target: 'Y', prob: 0.0 }, { source: 'H', target: 'Z', prob: 0.0 },
                    { source: 'X', target: 'H', prob: 1.0 }, { source: 'Y', target: 'H', prob: 1.0 }, { source: 'Z', target: 'H', prob: 1.0 }
                ],
                checkSuccess: ({ visits, steps }) => visits && visits.has('X') && visits.has('Y') && visits.has('Z') && steps <= 25
            }
        ];

        /* --- VISUALS POUR LES LEÇONS --- */
        
        const Lesson1Visual = () => (
            <div className="flex justify-center items-center py-6 bg-slate-900/50 rounded-xl mb-4 border border-slate-800 overflow-hidden">
                <svg width="340" height="160" viewBox="0 0 340 160">
                    <defs>
                        <marker id="arrow-l1" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b" /></marker>
                        <linearGradient id="grad-hidden" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stopColor="#3b82f6" />
                            <stop offset="100%" stopColor="#8b5cf6" />
                        </linearGradient>
                        <linearGradient id="grad-visible" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stopColor="#22c55e" />
                            <stop offset="100%" stopColor="#eab308" />
                        </linearGradient>
                    </defs>
                    
                    {/* Soleil */}
                    <g transform="translate(50, 80)">
                        <circle r="25" fill="#f59e0b" stroke="#f59e0b" strokeWidth="3" fillOpacity="0.2" />
                        <text y="5" textAnchor="middle" fill="#f59e0b" fontWeight="bold" fontSize="12">S</text>
                        {/* Self Loop S (Top Left) */}
                        <path d="M -15 -20 Q -40 -60 15 -20" fill="none" stroke="#f59e0b" strokeWidth="2" markerEnd="url(#arrow-l1)" />
                        <text x="-45" y="-35" fill="#f59e0b" fontSize="10">0.7</text>
                    </g>
                    
                    {/* Nuages */}
                    <g transform="translate(170, 80)">
                        <circle r="25" fill="#94a3b8" stroke="#94a3b8" strokeWidth="3" fillOpacity="0.2" />
                        <text y="5" textAnchor="middle" fill="#94a3b8" fontWeight="bold" fontSize="12">N</text>
                        {/* Self Loop N (Top) */}
                        <path d="M -15 -20 Q 0 -60 15 -20" fill="none" stroke="#94a3b8" strokeWidth="2" markerEnd="url(#arrow-l1)" />
                        <text x="-5" y="-55" fill="#94a3b8" fontSize="10">0.4</text>
                    </g>

                    {/* Pluie */}
                    <g transform="translate(290, 80)">
                        <circle r="25" fill="#3b82f6" stroke="#3b82f6" strokeWidth="3" fillOpacity="0.2" />
                        <text y="5" textAnchor="middle" fill="#3b82f6" fontWeight="bold" fontSize="12">P</text>
                        {/* Self Loop P (Top Right) */}
                        <path d="M 15 -20 Q 40 -60 -15 -20" fill="none" stroke="#3b82f6" strokeWidth="2" markerEnd="url(#arrow-l1)" />
                        <text x="35" y="-35" fill="#3b82f6" fontSize="10">0.7</text>
                    </g>

                    {/* Transitions S <-> N */}
                    <path d="M 75 70 Q 110 50 145 70" fill="none" stroke="#64748b" strokeWidth="1.5" markerEnd="url(#arrow-l1)" />

        const GraphView = ({ nodes, links, currentState, lastTransition, selectedNodeId, onNodeSelect, onNodeMove, showProbs, canEdit = true }) => {
            const [pan, setPan] = useState({ x: 0, y: 0 });
            const [zoom, setZoom] = useState(1);
            const [interactionMode, setInteractionMode] = useState('idle'); 
            const [draggedNodeId, setDraggedNodeId] = useState(null);
            const dragStart = useRef({ x: 0, y: 0 });
            const initialPan = useRef({ x: 0, y: 0 });
            const activeColor = lastTransition ? nodes.find(n => n.id === lastTransition.source)?.color : '#ec4899';

            const getPointerPos = (e) => {
                if (e.touches && e.touches.length > 0) {
                    return { x: e.touches[0].clientX, y: e.touches[0].clientY };
                }
                return { x: e.clientX, y: e.clientY };
            };

            const handlePointerDown = (e, nodeId = null) => {
                const { x, y } = getPointerPos(e);
                if (nodeId) {
                    if (!canEdit) return; 
                    e.stopPropagation(); setInteractionMode('dragging'); setDraggedNodeId(nodeId); onNodeSelect(nodeId);
                } else {
                    setInteractionMode('panning'); dragStart.current = { x, y }; initialPan.current = { ...pan }; onNodeSelect(null);
                }
            };
            const handlePointerMove = (e) => {
                if (interactionMode === 'idle') return;
                const { x, y } = getPointerPos(e);
                const svgRect = e.currentTarget.getBoundingClientRect();
                if (interactionMode === 'panning') {
                    setPan({ x: initialPan.current.x + x - dragStart.current.x, y: initialPan.current.y + y - dragStart.current.y });
                } else if (interactionMode === 'dragging' && draggedNodeId && canEdit) {
                    if(e.cancelable) e.preventDefault(); 
                    onNodeMove(draggedNodeId, (x - svgRect.left - pan.x) / zoom, (y - svgRect.top - pan.y) / zoom);
                }
            };
            const handlePointerUp = () => { setInteractionMode('idle'); setDraggedNodeId(null); };
            const getPath = (source, target) => {
                if (source.id === target.id) return `M ${source.x} ${source.y - 25} C ${source.x - 50} ${source.y - 100}, ${source.x + 50} ${source.y - 100}, ${source.x} ${source.y - 25}`;
                const dx = target.x - source.x, dy = target.y - source.y, dist = Math.sqrt(dx*dx + dy*dy) || 1;
                const offset = 35, perpX = -dy/dist * 15, perpY = dx/dist * 15;
                return `M ${source.x + (dx/dist)*offset + perpX} ${source.y + (dy/dist)*offset + perpY} L ${target.x - (dx/dist)*offset + perpX} ${target.y - (dy/dist)*offset + perpY}`;
            };

            return (
                <div className="w-full h-[400px] bg-slate-900/50 rounded-2xl border border-slate-800 relative overflow-hidden group">
                    <svg className={`w-full h-full ${interactionMode === 'panning' ? 'grabbing' : 'grab-cursor'}`} viewBox="0 0 400 400" onMouseDown={(e) => handlePointerDown(e)} onTouchStart={(e) => handlePointerDown(e)} onMouseMove={handlePointerMove} onTouchMove={handlePointerMove} onMouseUp={handlePointerUp} onTouchEnd={handlePointerUp} onMouseLeave={handlePointerUp} style={{ touchAction: 'none' }}>
                        <defs>
                            <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b" /></marker>
                            <marker id="arrow-active" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill={activeColor} /></marker>
                        </defs>
                        <g transform={`translate(${pan.x}, ${pan.y}) scale(${zoom})`}>
                            <rect x="-4000" y="-4000" width="8000" height="8000" opacity="0.1" fill="url(#grid-pattern)" pointerEvents="none" />
                            <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" strokeWidth="1"/></pattern>
                            {links.filter(l => l.prob > 0).map((link, i) => {
                                const s = nodes.find(n => n.id === link.source), t = nodes.find(n => n.id === link.target);
                                if (!s || !t) return null;
                                const active = lastTransition && lastTransition.source === s.id && lastTransition.target === t.id;
                                const isSelf = s.id === t.id;
                                let tx, ty;
                                if(isSelf) { tx = s.x; ty = s.y - 85; } else { const mx = (s.x+t.x)/2, my = (s.y+t.y)/2, dx = t.x-s.x, dy = t.y-s.y, dist = Math.sqrt(dx*dx+dy*dy)||1; const perpX = -dy/dist * 15, perpY = dx/dist * 15; tx = mx + perpX; ty = my + perpY; }
                                return (<g key={i}><path d={getPath(s, t)} stroke={active ? s.color : "#475569"} strokeWidth={active ? 3 : 2} fill="none" markerEnd={active ? "url(#arrow-active)" : "url(#arrow)"} className={active ? "active-link-pulse" : ""} />{showProbs && <g><rect x={tx-16} y={ty-9} width={32} height={18} rx={6} fill="#0f172a" fillOpacity={0.85}/><text x={tx} y={ty} fill="#e2e8f0" fontSize="10" textAnchor="middle" dominantBaseline="middle" fontWeight="bold" className="pointer-events-none select-none">{parseFloat(link.prob.toFixed(2))}</text></g>}</g>);
                            })}
                            {nodes.map(n => (<g key={n.id} onMouseDown={(e) => handlePointerDown(e, n.id)} onTouchStart={(e) => handlePointerDown(e, n.id)} className={`transition-shadow duration-300 ${canEdit ? 'node-cursor' : 'cursor-default'} ${currentState === n.id ? 'active-node-shadow' : ''}`} style={{color: n.color}}><circle cx={n.x} cy={n.y} r="25" fill={currentState === n.id ? n.color : '#1e293b'} stroke={n.color} strokeWidth={currentState === n.id ? 0 : 3} className={`transition-colors duration-300 ${selectedNodeId === n.id ? 'selected-node-border' : ''}`}/><text x={n.x} y={n.y} dy=".35em" textAnchor="middle" fill="white" fontWeight="bold" fontSize="16" className="pointer-events-none select-none">{n.label}</text></g>))}
                        </g>
                    </svg>
                    <div className="absolute bottom-4 right-4 bg-slate-800/90 rounded-lg border border-slate-700 p-1 flex flex-col gap-1">
                        <button onClick={() => setZoom(z => Math.min(z + 0.2, 3))} className="p-2 hover:bg-slate-700 rounded text-slate-300 hover:text-white"><Icons.Plus /></button>
                        <button onClick={() => setZoom(z => Math.max(z - 0.2, 0.5))} className="p-2 hover:bg-slate-700 rounded text-slate-300 hover:text-white"><Icons.Minus /></button>
                    </div>
                </div>
            );
        };

        const ChallengeView = ({ level, onBack, onWin, onError }) => {
            if (!level) return null;
            const [nodes, setNodes] = useState(level.initialNodes);
            const [links, setLinks] = useState(level.initialLinks);
            const [currentState, setCurrentState] = useState(level.initialNodes && level.initialNodes.length > 0 ? level.initialNodes[0].id : 'A');
            const [lastTransition, setLastTransition] = useState(null);
            const [selectedNodeId, setSelectedNodeId] = useState(level.initialNodes && level.initialNodes.length > 0 ? level.initialNodes[0].id : null);
            const [isSimulationRunning, setIsSimulationRunning] = useState(false);
            const [speed, setSpeed] = useState(1);
            const [steps, setSteps] = useState(0);
            const [visits, setVisits] = useState(new Set()); 
            const [path, setPath] = useState([level.initialNodes && level.initialNodes.length > 0 ? level.initialNodes[0].id : 'A']);
            const [successData, setSuccessData] = useState(null);
            const [pathRefreshKey, setPathRefreshKey] = useState(0);
            const [currentProb, setCurrentProb] = useState(1);
            const visitsRef = useRef(new Set());
            const intervalRef = useRef(null);
            const lastValidPi = useRef(null);

            const handleNodeMove = (id, x, y) => { setNodes(prev => prev.map(n => n.id === id ? { ...n, x, y } : n)); };
            const sortedNodes = useMemo(() => { return [...nodes].sort((a, b) => a.label.localeCompare(b.label)); }, [nodes]);

            const mathData = useMemo(() => {
                const N = nodes.length;
                if (N === 0) return { sorted: [], P: [], pi: null };
                const sorted = [...nodes].sort((a, b) => a.label.localeCompare(b.label));
                const P = Array(N).fill(0).map(() => Array(N).fill(0));
                let isValid = true;
                sorted.forEach((src, i) => {
                    let sum = 0;
                    sorted.forEach((tgt, j) => {
                        const link = links.find(l => l.source === src.id && l.target === tgt.id);
                        const val = link ? link.prob : 0;
                        P[i][j] = val;
                        sum += val;
                    });
                    if (Math.abs(sum - 1.0) > 0.01) isValid = false;
                });
                let pi = null;
                if (isValid) {
                    pi = Array(N).fill(1/N);
                    for(let k=0; k<50; k++) { let nextPi = Array(N).fill(0); for(let j=0; j<N; j++) { for(let i=0; i<N; i++) { nextPi[j] += pi[i] * P[i][j]; } } pi = nextPi; }
                    lastValidPi.current = pi; 
                } else { pi = lastValidPi.current; }
                return { sorted, P, pi };
            }, [nodes, links]);

            const isGraphValid = useMemo(() => {
                return nodes.every(node => {
                    const sum = links
                        .filter(l => l.source === node.id)
                        .reduce((acc, curr) => acc + curr.prob, 0);
                    return Math.abs(sum - 1.0) < 0.01;
                });
            }, [nodes, links]);

            useEffect(() => {
                try {
                    if (isGraphValid && level.checkSuccess({ visits: visitsRef.current, pi: mathData.pi, links: links, nodes: nodes, path: path, steps: steps })) {
                          if (!successData) { setSuccessData(true); onWin(level.id); }
                }
                } catch (e) {}
            }, [mathData, links, level, successData, onWin, steps, nodes, path, isGraphValid]);

            const step = useCallback(() => {
                const possibleLinks = links.filter(l => l.source === currentState && l.prob > 0);
                if (possibleLinks.length === 0) return;
                const rand = Math.random();
                let cumulative = 0;
                let nextState = currentState;
                let selectedLink = null;
                for (let link of possibleLinks) { 
                    cumulative += link.prob; 
                    if (rand <= cumulative) { 
                        nextState = link.target; 
                        selectedLink = link;
                        break; 
                    } 
                }
                
                if (selectedLink) setCurrentProb(prev => prev * selectedLink.prob);

                setLastTransition({ source: currentState, target: nextState });
                setCurrentState(nextState);
                
                setPath(prev => [...prev, nextState]);

                setSteps(s => {
                    const newSteps = s + 1;
                    visitsRef.current.add(nextState);
                    const currentVisits = new Set(visitsRef.current);
                    setVisits(currentVisits);

                    try {
                          if (isGraphValid && level.checkSuccess({ visits: currentVisits, pi: mathData.pi, links: links, nodes: nodes, path: [...path, nextState], steps: newSteps })) {
                            setIsSimulationRunning(false);
                            setSuccessData({ steps: newSteps }); 
                            onWin(level.id); 
                        }
                    } catch (e) {}
                    return newSteps;
                });

            }, [links, currentState, level, mathData, onWin, path, isGraphValid]);

            useEffect(() => {
                if (isSimulationRunning) { intervalRef.current = setInterval(step, 500 / speed); } 
                else { clearInterval(intervalRef.current); }
                return () => clearInterval(intervalRef.current);
            }, [isSimulationRunning, speed, step]);

            const updateProbability = (targetId, newProb) => {
                if (!selectedNodeId) return;
                const probValue = parseFloat(newProb);
                setLinks(prevLinks => {
                    const linkExists = prevLinks.find(l => l.source === selectedNodeId && l.target === targetId);
                    if (linkExists) { return prevLinks.map(l => (l.source === selectedNodeId && l.target === targetId) ? { ...l, prob: probValue } : l); }
                    return [...prevLinks, { source: selectedNodeId, target: targetId, prob: probValue }];
                });
            };

            const normalizeProbs = () => {
                if (!selectedNodeId) return;
                setLinks(prevLinks => {
                    const indices = prevLinks.map((l, i) => l.source === selectedNodeId ? i : -1).filter(i => i !== -1);
                    if (indices.length === 0) return prevLinks;
                    const total = indices.reduce((acc, idx) => acc + prevLinks[idx].prob, 0);
                    if (total === 0) return prevLinks;
                    const factor = 1 / total;
                    let currentSum = 0;
                    const newLinks = [...prevLinks];
                    for (let i = 0; i < indices.length - 1; i++) {
                        const idx = indices[i];
                        const val = Math.round((newLinks[idx].prob * factor) * 100) / 100;
                        newLinks[idx] = { ...newLinks[idx], prob: val };
                        currentSum += val;
                    }
                    const lastIdx = indices[indices.length - 1];
                    const remainder = parseFloat((1.0 - currentSum).toFixed(2));
                    newLinks[lastIdx] = { ...newLinks[lastIdx], prob: Math.max(0, remainder) };
                    return newLinks;
                });
            };

            const handleNodeSelect = (id) => { 
                setSelectedNodeId(id); 
                if(id && !isSimulationRunning) { 
                    setCurrentState(id); 
                    setPath([id]); 
                    setLastTransition(null); 
                    setSteps(0); 
                    setVisits(new Set()); 
                    visitsRef.current = new Set();
                    setCurrentProb(1); 
                    setSuccessData(null); 
                    setPathRefreshKey(k => k + 1); 
                } 
            };

            const handlePlayToggle = () => {
                if (!isSimulationRunning) {
                    const invalid = nodes.find(n => {
                        const sum = links.filter(l => l.source === n.id).reduce((a, b) => a + b.prob, 0);
                        return Math.abs(sum - 1.0) > 0.01;
                    });
                    if (invalid) {
                        const sum = links.filter(l => l.source === invalid.id).reduce((a, b) => a + b.prob, 0);
                        onError(`Impossible de lancer : La somme des probabilités de "${invalid.label}" est de ${sum.toFixed(2)} (doit être 1.00)`);
                        return;
                    }
                    if(steps === 0 && !successData) {
                        setVisits(new Set([currentState]));
                        visitsRef.current = new Set([currentState]);
                        setPath([currentState]);
                        setCurrentProb(1);
                        setPathRefreshKey(k => k + 1);
                    }
                }
                setIsSimulationRunning(!isSimulationRunning);

            const lessons = [
                { id: 1, title: "Qu'est-ce qu'une chaîne de Markov ?", icon: "atom", color: "bg-cyan-500", content: "C'est un système mathématique composé d’un ensemble d’états, noté E (comme la météo : Soleil, Nuages et Pluie), et de transitions entre ces états. Plus formellement, il s’agit d’une suite de variables aléatoires à valeurs dans E, qui respecte la propriété de Markov : la probabilité de chaque état futur dépend uniquement de l'état présent (absence de mémoire)." },
                { id: 2, title: "Matrice de transition", icon: "shuffle", color: "bg-purple-500", content: "La dynamique de la chaîne est entièrement régie par sa matrice de transition, notée P. Il s’agit d’une matrice carrée dont chaque coefficient (i,j) représente la probabilité conditionnelle de passer de i à j en une étape. Pour être valide, la matrice P doit être stochastique, ce qui impose deux contraintes structurelles : chaque coefficient (i,j) doit être positif, et la somme des probabilités de transition partant d’un état i doit valoir 1." },
                { id: 3, title: "Convergence et loi stationnaire", icon: "activity", color: "bg-pink-500", content: "Si on laisse tourner le système longtemps, les probabilités se stabilisent souvent vers un équilibre, appelé la loi stationnaire π de la chaîne de Markov. Peu importe l'état de départ, on a une probabilité fixe de se trouver dans chaque état à long terme. On peut observer cela en multipliant la matrice P par elle-même plusieurs fois." },
                { id: 4, title: "Modèle de Markov caché (HMM)", icon: "lightbulb", color: "bg-orange-500", content: "Parfois, on n'a pas accès à l'état réel, mais seulement à des indices ou des observations. Un modèle de Markov caché (Hidden Markov Model - HMM) est un modèle utilisé pour représenter un phénomène qui évolue dans le temps, lorsque l’on ne peut pas observer directement son état réel (comme l'exemple de la maladie, qu'on ne peut pas toujours observer). Le modèle associe donc des probabilités aux changements d’états et aux observations produites par chaque état. Grâce à ces probabilités, on peut estimer l’état caché le plus probable du système à chaque instant." }

            return (

                    <div className="p-6 rounded-2xl bg-gradient-to-r from-blue-900 to-indigo-900 border border-blue-500/30"><div className="flex items-center gap-4 mb-2"><div className="p-3 bg-blue-500/20 rounded-xl text-blue-400"><Icons.BookOpen /></div><h2 className="dark-card-header">Bienvenue !</h2></div><p className="dark-card-desc">Découvrez les concepts fondamentaux des chaînes de Markov à travers ces leçons interactives.</p></div>

        const Sandbox = ({ isActive, onError }) => {
            const [nodes, setNodes] = useState(SANDBOX_NODES);
            const [links, setLinks] = useState(SANDBOX_LINKS);
            const [currentState, setCurrentState] = useState('A');
            const [lastTransition, setLastTransition] = useState(null); 
            const [selectedNodeId, setSelectedNodeId] = useState(SANDBOX_NODES.length > 0 ? SANDBOX_NODES[0].id : null);
            const [isPlaying, setIsPlaying] = useState(false);
            const [speed, setSpeed] = useState(1);
            const [path, setPath] = useState(['A']);
            const [showProbs, setShowProbs] = useState(true);
            const [pathRefreshKey, setPathRefreshKey] = useState(0);
            const [currentProb, setCurrentProb] = useState(1); // STATE POUR LA PROBA CUMULÉE
            const intervalRef = useRef(null);
            
            // Persistance de PI pour Sandbox
            const lastValidPi = useRef(null);

            // --- MATH CALCULATIONS (Copied logic from Challenge for Sandbox) ---
            const mathData = useMemo(() => {
                const N = nodes.length;
                if (N === 0) return { sorted: [], P: [], pi: null };

                const sorted = [...nodes].sort((a, b) => a.label.localeCompare(b.label));
                const P = Array(N).fill(0).map(() => Array(N).fill(0));
                let isValid = true;
                
                sorted.forEach((src, i) => {
                    let sum = 0;
                    sorted.forEach((tgt, j) => {
                        const link = links.find(l => l.source === src.id && l.target === tgt.id);
                        const val = link ? link.prob : 0;
                        P[i][j] = val;
                        sum += val;
                    });
                    if (Math.abs(sum - 1.0) > 0.01) isValid = false;
                });

                let pi = null;
                if (isValid) {
                    pi = Array(N).fill(1/N);
                    for(let k=0; k<50; k++) {
                         let nextPi = Array(N).fill(0);
                         for(let j=0; j<N; j++) {
                             for(let i=0; i<N; i++) {
                                 nextPi[j] += pi[i] * P[i][j];
                             }
                         }
                         pi = nextPi;
                    }
                    lastValidPi.current = pi; 
                } else {
                    pi = lastValidPi.current; 
                }

                return { sorted, P, pi };
            }, [nodes, links]);

            const handleNodeMove = (id, x, y) => setNodes(prev => prev.map(n => n.id === id ? { ...n, x, y } : n));
            const step = useCallback(() => {
                setPath(prev => {
                    const currentId = prev[prev.length - 1];
                    const possible = links.filter(l => l.source === currentId && l.prob > 0);
                    if (possible.length === 0) return prev;
                    const rand = Math.random(); 
                    let cumulative = 0; 
                    let next = currentId;
                    let selectedLink = null;
                    for (let l of possible) { 
                        cumulative += l.prob; 
                        if (rand <= cumulative) { 
                            next = l.target; 
                            selectedLink = l;
                            break; 
                        } 
                    }

                    if(selectedLink) {
                        setCurrentProb(prev => prev * selectedLink.prob);
                    }

                    setLastTransition({ source: currentId, target: next }); setCurrentState(next);
                    const newPath = [...prev, next]; if(newPath.length>12) newPath.shift(); return newPath;
                });
            }, [links]);
            useEffect(() => { if (isPlaying && isActive) intervalRef.current = setInterval(step, 1000/speed); else clearInterval(intervalRef.current); return () => clearInterval(intervalRef.current); }, [isPlaying, speed, step, isActive]);
            
            const handleNodeSelect = (id) => { 
                setSelectedNodeId(id); 
                if(id && !isPlaying) { 
                    setCurrentState(id); 
                    setPath([id]); 
                    setLastTransition(null); 
                    setPathRefreshKey(k => k + 1); 
                    setCurrentProb(1); // RESET PROB
                } 
            };
            
            // --- CONSTANTES DE COULEUR ET STATE ---
            const COLORS = ['#f97316', '#22c55e', '#eab308', '#ef4444', '#a855f7', '#14b8a6', '#f43f5e', '#84cc16'];
            const [newNodeLabel, setNewNodeLabel] = useState(''); 
            const [selectedColorIndex, setSelectedColorIndex] = useState(0);

            const addState = () => { 
                let id = newNodeLabel.trim().toUpperCase(); 
                
                if (!id) {
                    let charCode = 65;
                    id = String.fromCharCode(charCode);
                    while (nodes.find(n => n.id === id)) { 
                        charCode++; 
                        id = String.fromCharCode(charCode); 
                    }
                } else {
                    if (nodes.find(n => n.id === id)) {
                        onError(`L'état "${id}" existe déjà !`);
                        return;
                    }
                }
                
                const color = COLORS[selectedColorIndex];

                setNodes([...nodes, { id, x: 200, y: 200, color, label: id }]); 
                const target = nodes.length > 0 ? nodes[0].id : id;
                setLinks([...links, {source:id, target: target, prob: 0}]); 
                setNewNodeLabel(''); 
            };

            const updateProbability = (targetId, newProb) => { if (!selectedNodeId) return; setLinks(prev => { const exists = prev.find(l => l.source === selectedNodeId && l.target === targetId); if (exists) return prev.map(l => (l.source === selectedNodeId && l.target === targetId) ? { ...l, prob: parseFloat(newProb) } : l); return [...prev, { source: selectedNodeId, target: targetId, prob: parseFloat(newProb) }]; }); };
            
            const normalizeProbs = () => {
                if (!selectedNodeId) return;
                setLinks(prevLinks => {
                    const indices = prevLinks.map((l, i) => l.source === selectedNodeId ? i : -1).filter(i => i !== -1);
                    if (indices.length === 0) return prevLinks;
                    const total = indices.reduce((acc, idx) => acc + prevLinks[idx].prob, 0);
                    if (total === 0) return prevLinks;
                    const factor = 1 / total;
                    let currentSum = 0;
                    const newLinks = [...prevLinks];
                    for (let i = 0; i < indices.length - 1; i++) {
                        const idx = indices[i];
                        const val = Math.round((newLinks[idx].prob * factor) * 100) / 100;
                        newLinks[idx] = { ...newLinks[idx], prob: val };
                        currentSum += val;
                    }
                    const lastIdx = indices[indices.length - 1];
                    const remainder = parseFloat((1.0 - currentSum).toFixed(2));
                    newLinks[lastIdx] = { ...newLinks[lastIdx], prob: Math.max(0, remainder) };
                    return newLinks;
                });
            };

            const deleteState = () => { if(!selectedNodeId) return; setNodes(nodes.filter(n=>n.id!==selectedNodeId)); setLinks(links.filter(l=>l.source!==selectedNodeId && l.target!==selectedNodeId)); setSelectedNodeId(null); };
            
            const handlePlayToggle = () => {
                if (!isPlaying) {
                    const invalidNode = nodes.find(n => {
                        const sum = links.filter(l => l.source === n.id).reduce((a, b) => a + b.prob, 0);
                        return Math.abs(sum - 1.0) > 0.01;
                    });
                    
                    if (invalidNode) {
                        const sum = links.filter(l => l.source === invalidNode.id).reduce((a, b) => a + b.prob, 0);
                        onError(`Impossible de lancer : La somme des probabilités de "${invalidNode.label}" est de ${sum.toFixed(2)} (doit être 1.00)`);
                        return; 
                    }
                    setPath([currentState]);
                    setLastTransition(null);
                    setPathRefreshKey(k => k + 1);
                    setCurrentProb(1); // RESET PROB
                }
                setIsPlaying(!isPlaying);
            };
            
            const selectedNodeData = nodes.find(n => n.id === selectedNodeId);
            const currentSum = selectedNodeId ? links.filter(l => l.source === selectedNodeId).reduce((a, b) => a + b.prob, 0) : 0;
            const isNorm = Math.abs(currentSum - 1.0) < 0.01;

            const pathProbability = path.reduce((acc, curr, i) => {
                if (i === 0) return 1;
                const prev = path[i-1];
                const link = links.find(l => l.source === prev && l.target === curr);
                return acc * (link ? link.prob : 0);
            }, 1);

            return (
                <div className="flex flex-col gap-4 pb-24 animate-in fade-in duration-500 relative">
                    <GraphView nodes={nodes} links={links} currentState={currentState} lastTransition={lastTransition} selectedNodeId={selectedNodeId} onNodeSelect={handleNodeSelect} onNodeMove={handleNodeMove} showProbs={showProbs} />
                    
                    {/* ZONE DE CRÉATION REGROUPÉE */}
                    <div className="bg-slate-800/80 p-3 rounded-2xl border border-slate-700 flex gap-3 items-center shadow-lg">
                        <div className="flex gap-2">
                            <input
                                type="text"
                                maxLength={1}
                                placeholder="..."
                                className="w-12 h-12 bg-slate-900 border border-slate-700 rounded-xl text-center font-bold text-white focus:border-blue-500 outline-none transition-colors shrink-0"
                                value={newNodeLabel}
                                onChange={(e) => setNewNodeLabel(e.target.value.toUpperCase())}
                            />
                            <button 
                                type="button"
                                onClick={() => setSelectedColorIndex((prev) => (prev + 1) % COLORS.length)}
                                className="w-12 h-12 rounded-xl border border-slate-700 flex items-center justify-center transition-all active:scale-95 shadow-lg shrink-0"
                                style={{backgroundColor: COLORS[selectedColorIndex]}}
                                title="Changer la couleur"
                            >
                                <Icons.Brush />
                            </button>
                        </div>
                        <Button onClick={addState} className="flex-1 h-12 shadow-blue-500/20">
                            <Icons.Plus /> Ajouter
                        </Button>
                    </div>

                    {selectedNodeId && selectedNodeData && (
                        <div className="dark-card p-4 animate-in slide-in-from-bottom">
                            <div className="flex justify-between items-center mb-4">
                                <h3 className="font-bold text-lg">Transitions de <span style={{color: selectedNodeData.color}}>{selectedNodeData.label}</span></h3>
                                <div className="flex gap-2">
                                    <button onClick={normalizeProbs} className={`px-3 py-1.5 text-xs rounded-full font-bold flex items-center gap-1 border transition-all ${isNorm ? 'bg-green-500/10 text-green-400 border-green-500/30 hover:shadow-[0_0_12px_rgba(74,222,128,0.6)]' : 'bg-yellow-500/10 text-yellow-500 border-yellow-500/30 hover:shadow-[0_0_12px_rgba(234,179,8,0.6)]'}`}><span>Σ</span><span>=</span><span>{currentSum.toFixed(2)}</span></button>
                                    <Button variant="danger" onClick={deleteState} className="py-1 px-3 h-auto"><Icons.Trash /></Button>
                                </div>
                            </div>
                            <div className="space-y-4">
                                {nodes.map(target => {
                                    const link = links.find(l => l.source === selectedNodeId && l.target === target.id);
                                    const prob = link ? link.prob : 0;
                                    const isSelf = selectedNodeId === target.id;
                                    return (
                                        <div key={target.id} className="flex items-center gap-3">
                                            <div className="flex items-center gap-1 w-16 shrink-0 font-bold text-slate-300">
                                                <span style={{color: selectedNodeData.color}}>{selectedNodeData.label}</span>
                                                {isSelf ? <Icons.RotateCw /> : <Icons.ArrowRight />}
                                                <span style={{color: target.color}}>{target.label}</span>
                                            </div>
                                            <input type="range" min="0" max="1" step="0.05" value={prob} onChange={(e) => updateProbability(target.id, e.target.value)} className="flex-1 h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-blue-500" />
                                            <span className="w-10 text-right font-mono text-slate-200 font-bold">{prob.toFixed(2)}</span>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    )}
                    <div className="flex flex-col gap-4">
                        <div className="flex gap-2">
                            <Button variant="secondary" className="flex-1" onClick={handlePlayToggle}>{isPlaying ? <Icons.Pause /> : <Icons.Play />} {isPlaying ? "Pause" : "Lancer"}</Button>
                            {/* MODIFICATION ICI : Taille de l'icone Eye ajustée à 26 */}
                            <Button variant="icon" className="w-12 h-12 !p-0 flex items-center justify-center" onClick={() => setShowProbs(!showProbs)}>{showProbs ? <Icons.Eye size={26} /> : <Icons.EyeOff size={26} />}</Button>
                            {/* MODIFICATION ICI : Taille de l'icone Refresh ajustée à 26 */}
                            <Button variant="icon" className="w-12 h-12 !p-0 flex items-center justify-center" onClick={() => {
                                setIsPlaying(false); 
                                setPath([selectedNodeId||'A']); 
                                setCurrentState(selectedNodeId||'A');
                                setCurrentProb(1); // RESET PROB
                                setPathRefreshKey(k => k + 1);
                            }}><Icons.RotateCcw size={26} /></Button>
                        </div>
                        <div className="bg-slate-800/50 p-3 rounded-xl flex items-center gap-3"><span className="text-xs text-slate-400 shrink-0">Vitesse</span><input type="range" min="1" max="10" step="1" value={speed} onChange={(e) => setSpeed(Number(e.target.value))} className="flex-1 h-1 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-blue-500" /><span className="text-xs font-mono w-6 text-right">{speed}x</span></div>
                    </div>
                    
                    <div className="dark-card p-4">
                        <div className="flex justify-between items-center mb-2">
                            <h3 className="font-bold text-lg">Chemin parcouru</h3>
                            {/* DISPLAY CUMULATIVE PROBABILITY HERE */}
                            <span className="text-xs font-mono text-cyan-300 bg-cyan-950/50 px-2 py-1 rounded-lg border border-cyan-800">
                                {/* MODIFICATION ICI : Affichage conditionnel de P */}
                                P = {(currentProb > 0 && currentProb < 0.000001) ? "0.000001" : currentProb.toFixed(6)}
                            </span>
                        </div>
                        <div key={pathRefreshKey} className="flex gap-2 overflow-x-auto py-4 px-4 scrollbar-hide" ref={el => el && (el.scrollLeft = el.scrollWidth)}>
                            {path.map((p, i) => { 
                                const n = nodes.find(no => no.id === p); 
                                const isActive = i === path.length - 1;
                                return (
                                    <div key={`${i}-${p}`} className={`flex items-center shrink-0 ${isActive?'animate-pop':''}`}>
                                        <span 
                                            className={`w-8 h-8 rounded-lg flex items-center justify-center font-bold text-sm transition-all ${isActive?'text-white scale-110':'bg-slate-700 text-slate-300'}`} 
                                            style={isActive ? {backgroundColor:n?.color, boxShadow: `0 0 15px ${n?.color}`} : {}}
                                        >
                                            {p}
                                        </span>
                                        {i < path.length - 1 && <div className="mx-1 text-slate-600"><Icons.ArrowRight /></div>}
                                    </div>
                                )
                            })}
                        </div>
                    </div>

                    {/* DISTRIBUTION STATIONNAIRE (PI) - AVEC FIX CRASH */}
                    <div className="dark-card p-4 mt-2">
                        <h3 className="font-bold text-lg mb-2">Distribution Stationnaire π</h3>
                        <div className="flex flex-wrap gap-3">
                            {mathData.sorted.map((n, i) => (
                                <div key={n.id} className="flex items-center gap-2 bg-slate-800/50 px-3 py-2 rounded-lg border border-slate-700/50">
                                    <span className="font-bold w-6 h-6 flex items-center justify-center rounded-md text-xs" style={{backgroundColor: n.color}}>{n.label}</span>
                                    <span className="font-mono text-cyan-300 text-sm">
                                        {/* CRITICAL FIX: Check if pi[i] exists before toFixed */}
                                        {mathData.pi && mathData.pi[i] !== undefined ? mathData.pi[i].toFixed(4) : "-"}
                                    </span>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* MATRICE DE TRANSITION */}
                    <div className="dark-card p-4 mt-2">
                        <h3 className="font-bold text-lg mb-2">Matrice de Transition</h3>
                        <div className="overflow-x-auto">
                            <table className="w-full text-xs text-center border-collapse">
                                <thead>
                                    <tr>
                                        <th className="p-2 text-slate-500 border-b border-slate-700/50">De \ Vers</th>
                                        {mathData.sorted.map(n => (
                                            <th key={n.id} className="p-2 border-b border-slate-700/50" style={{color: n.color}}>{n.label}</th>
                                        ))}
                                    </tr>
                                </thead>
                                <tbody>
                                    {mathData.sorted.map((source, i) => (
                                        <tr key={source.id} className="hover:bg-slate-800/30 transition-colors">
                                            <td className="p-2 font-bold border-r border-slate-700/50" style={{color: source.color}}>{source.label}</td>
                                            {mathData.sorted.map((target, j) => (
                                                <td key={target.id} className="p-2 text-slate-300 font-mono">
                                                    {mathData.P[i][j].toFixed(2)}
                                                </td>
                                            ))}
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            // MODIFICATION ICI : On démarre sur 'learn' au lieu de 'sandbox'
            const [activeTab, setActiveTab] = useState('learn');
            const [selectedLevelId, setSelectedLevelId] = useState(null);
            const [slideDirection, setSlideDirection] = useState('slide-enter-right');
            const [globalError, setGlobalError] = useState(null);
            
            const [levelsStatus, setLevelsStatus] = useState({
                1: { unlocked: true, completed: false },
                2: { unlocked: false, completed: false },
                3: { unlocked: false, completed: false },
                4: { unlocked: false, completed: false },
                5: { unlocked: false, completed: false },
            });

            const handleWinLevel = (levelId, stars) => {
                setLevelsStatus(prev => {
                    const newState = { ...prev };
                    if (newState[levelId]) newState[levelId].completed = true;
                    if (newState[levelId + 1]) newState[levelId + 1].unlocked = true;
                    return newState;
                });
            };

            const handleError = (msg) => {
                setGlobalError(msg);
                setTimeout(() => setGlobalError(null), 4000);
            };

            const handleTabChange = (newTab) => {
                if (newTab === activeTab) return;
                const tabOrder = { 'learn': 0, 'challenges': 1, 'sandbox': 2 };
                const currentOrder = tabOrder[activeTab];
                const newOrder = tabOrder[newTab];
                if (newOrder > currentOrder) setSlideDirection('slide-enter-right');
                else setSlideDirection('slide-enter-left');
                setActiveTab(newTab);
            };

            return (
                <div className="max-w-md mx-auto min-h-screen bg-slate-900 text-white relative flex flex-col overflow-hidden">
                    {globalError && (
                        <div className="error-toast">
                            <Icons.Alert />
                            <span>{globalError}</span>
                        </div>
                    )}
                    <header className="p-6 pt-8 pb-2 shrink-0"><h1 className="text-3xl font-bold tracking-tight text-center">Markov Explorer</h1></header>
                    <main className="flex-1 p-4 overflow-y-auto scrollbar-hide relative overflow-x-hidden">
                        <div key={activeTab} className={slideDirection}>
                            <div className={activeTab === 'sandbox' ? 'block' : 'hidden'}><Sandbox isActive={activeTab === 'sandbox'} onError={handleError} /></div>
                            {activeTab === 'challenges' && (
                                selectedLevelId ? 
                                <ChallengeView 
                                    key={selectedLevelId}
                                    level={LEVELS_DATA.find(l => l.id === selectedLevelId)} 
                                    onBack={() => setSelectedLevelId(null)} 
                                    onWin={handleWinLevel} 
                                    onError={handleError}
                                /> : 
                                <LevelsList onSelectLevel={setSelectedLevelId} levelsStatus={levelsStatus} />
                            )}
                            {activeTab === 'learn' && <Learn />}
                        </div>
                    </main>
                    <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-slate-900/90 backdrop-blur-lg border-t border-slate-800 p-2 pb-6 z-50">
                        <div className="flex justify-around items-center">
                            <button onClick={() => handleTabChange('learn')} className={`flex flex-col items-center gap-1 p-2 rounded-xl transition-all ${activeTab === 'learn' ? 'text-blue-400' : 'text-slate-500'}`}><Icons.BookOpen /> <span className="text-[10px]">Apprendre</span></button>
                            <button onClick={() => handleTabChange('challenges')} className={`flex flex-col items-center gap-1 p-2 rounded-xl transition-all ${activeTab === 'challenges' ? 'text-purple-400' : 'text-slate-500'}`}><Icons.Trophy /> <span className="text-[10px]">Défis</span></button>
                            <button onClick={() => handleTabChange('sandbox')} className={`flex flex-col items-center gap-1 p-2 rounded-xl transition-all ${activeTab === 'sandbox' ? 'text-cyan-400' : 'text-slate-500'}`}><Icons.BoxSelect /> <span className="text-[10px]">Bac à sable</span></button>
                        </div>
                    </nav>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
